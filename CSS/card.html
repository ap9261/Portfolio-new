<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <div class="card">
        <img src="img2.jpg" alt="Shivaji Maharaj">

        <div class="desc">
            <h3>Chhatrapati Shivaji Maharaj</h3>
            <p>Founder of the Maratha Empire</p>
        </div>
    </div>

    <div class="card">
        <img src="img1.jpeg" alt="Sambhaji Maharaj">

        <div class="desc">
            <h3>Chhatrapati Sambhaji Maharaj</h3>
            <p>Second ruler of the Maratha Empire</p>
        </div>
    </div>

</body>
</html>
